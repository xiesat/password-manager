name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # 配置了代码签名证书时会自动签名；未配置则为空，签名步骤自动跳过
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run tests before packaging
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install pytest
          pytest -q

      - name: Build executable
        run: pyinstaller --noconfirm --clean 密码管理器.spec

      - name: Sign executable (optional)
        if: env.WIN_CSC_LINK != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CSC_LINK))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WIN_CSC_KEY_PASSWORD /tr http://timestamp.digicert.com /td SHA256 dist\PasswordManager.exe
          Remove-Item $pfx -Force

      - name: Compute checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/PasswordManager.exe -Algorithm SHA256).Hash
          "$hash  PasswordManager.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PasswordManager-windows
          path: |
            dist/PasswordManager.exe
            dist/SHA256SUMS.txt

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PasswordManager.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
