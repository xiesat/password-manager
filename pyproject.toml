[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "password-manager"
version = "0.9.0"
description = "本地加密密码管理器（PySide6 + AES-256-GCM）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6,<7",
    "pycryptodome>=3.20",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.gui-scripts]
password-manager = "main:main"

[tool.setuptools]
py-modules = [
    "main", "applog", "storage", "encryption", "password_generator",
    "model", "controller", "view", "table_model", "theme", "io_exchange",
    "hlc", "merge", "sync_service", "sync_dialog",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"
# 文档里的示例代码块不参与格式化（否则每次改 md 都可能让 CI 失败）
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
# 先对不依赖 GUI 的核心模块做类型检查（其余模块待后续补齐）
files = [
    "storage.py", "applog.py", "encryption.py", "password_generator.py",
    "model.py", "theme.py", "io_exchange.py", "hlc.py", "merge.py",
]
